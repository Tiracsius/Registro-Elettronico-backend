spring.datasource.url=jdbc:h2:mem:registroelettronico;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.defer-datasource-initialization=true

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.sql.init.mode=always

# Enable the H2 console for easy inspection of the in-memory database
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT configuration
jwt.secret=replace-this-secret-with-a-long-random-string-of-your-choice
jwt.expiration=86400000

spring.security.headers.frame=false