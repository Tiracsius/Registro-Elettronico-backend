spring.datasource.url=jdbc:h2:mem:registroelettronico;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Disable JPA from automatically creating or updating the schema because
# we provide our own schema via schema.sql. Use 'none' so that Hibernate
# doesn't attempt to manage the database schema. See
# https://docs.spring.io/spring-boot/docs/current/reference/html/howto.html#howto-database-initialization
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Always run SQL initialization scripts on startup. This ensures our
# schema.sql file is executed to create the in-memory database schema.
spring.sql.init.mode=never

# Optionally specify the schema script location if you want to override
# the default lookup (classpath:schema.sql). Leaving this commented uses
# the default naming convention.
# spring.sql.init.schema-locations=classpath:schema.sql

# Enable the H2 console for easy inspection of the in-memory database
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT configuration
jwt.secret=replace-this-secret-with-a-long-random-string-of-your-choice
jwt.expiration=86400000